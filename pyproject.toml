[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acme-ap"
version = "1.0.0"
description = "Multi-agent invoice processing for Acme Corp accounts payable"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "pdfplumber>=0.11",
    "rich>=13.7",
    "typer>=0.12",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "pyyaml>=6.0",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10", "types-PyYAML", "reportlab>=4.0"]
demo = ["playwright>=1.50"]

[project.scripts]
acme-ap = "acme_ap.cli:app"

[tool.setuptools.packages.find]
include = ["acme_ap*"]

[tool.setuptools.package-data]
acme_ap = ["db/*.sql", "api/static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
# E501: formatting is delegated to `ruff format`.
# SIM102: the parser dispatch reads as a priority ladder; collapsing the
#         nested ifs with `and` hides that structure.
ignore = ["E501", "SIM102"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
disallow_untyped_defs = true
# Absolute "no explicit Any": pydantic-generated typing leaks it, suppressed at
# the class-def line with a targeted `# type: ignore[explicit-any]`.
disallow_any_explicit = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
